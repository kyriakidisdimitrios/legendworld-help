      <h2 style="color:#6ee7b7;font-size:28px;">Expanding Land – Help & Game Guide</h2>
      <p style="font-size:18px;line-height:1.6;">Expanding Land is an independent multiplayer browser cell game with a circular map that expands and contracts. Human and server-controlled bot populations vary by arena.</p>

      <h3 style="color:#6ee7b7;">🎮 Game Features</h3>
      <ul style="line-height:2;">
        <li><strong>Multiplayer population</strong> — Human players and server-controlled bots are counted separately; populations vary by arena.</li>
        <li><strong>Dynamic circular map</strong> — expands and contracts</li>
        <li><strong>Spectator mode</strong> — watch the game</li>
        <li><strong>C server</strong> — designed for multiplayer performance</li>
        <li><strong>Encrypted Connections</strong> — WSS/TLS for security</li>
        <li><strong>Anti-Cheat Protection</strong> — Coordinate scrambling per player</li>
        <li><strong>Custom Skins</strong> — Full skin support via Legend Mod</li>
        <li><strong>Session Stats</strong> — Time alive, highest mass, food eaten, players eaten</li>
        <li><strong>In-Game Chat</strong> — Communicate with other players</li>
        <li><strong>Leaderboard</strong> — Compete for the #1 spot</li>
        <li><strong>Ghost Cells</strong> — See where you died</li>
        <li><strong>Spectator Mode</strong> — Free-roam spectating</li>
      </ul>

      <h3 style="color:#6ee7b7;">🕹️ How to Play</h3>
      <ol style="line-height:2;">
        <li>Visit <a href="https://expanding.land/" style="color:#6ee7b7;">expanding.land</a> in your browser</li>
        <li>Enter a nickname and click Play</li>
        <li>Move with your mouse, eat food and smaller players to grow</li>
        <li>Press <strong>Space</strong> to split, <strong>W</strong> to eject mass</li>
        <li>Climb the leaderboard and dominate!</li>
      </ol>

      <h3 style="color:#6ee7b7;">🔗 Compatible Mods</h3>
      <ul style="line-height:2;">
        <li><a href="https://www.legendmod.ml/" style="color:#6ee7b7;">Legend Mod</a> — Custom skins, themes, and enhanced features</li>
        <li><a href="https://deltio.pages.dev/" style="color:#6ee7b7;">Delta Mod</a> — Advanced IO game client extension</li>
        <li><a href="https://agar2.com/" style="color:#6ee7b7;">Agar2</a> — Feature-rich IO game client</li>
      </ul>

      <h3 style="color:#6ee7b7;">📊 Performance</h3>
      <p>The game uses a C-based server. Performance varies by load, network and device.</p>
